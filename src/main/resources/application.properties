spring.application.name=bytegames

# --- BANCO DE DADOS DE DESENVOLVIMENTO (H2 EM MEMÓRIA - NÃO REQUER SERVIÇOS EXPETNOS) ---
# spring.datasource.url=jdbc:h2:mem:Byteloja;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- BANCO DE DADOS DE PRODUÇÃO / APRESENTAÇÃO (MYSQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:Byteloja}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configurações do Pool de Conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desabilita o cache do Thymeleaf em desenvolvimento
spring.thymeleaf.cache=false

# Configurações de limite de upload de arquivos (Evita HTTP 413 Payload Too Large)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Pasta onde as capas de produto sao gravadas (fora do classpath, ignorada pelo git)
bytegames.uploads.diretorio=uploads
